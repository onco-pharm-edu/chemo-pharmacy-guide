<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薬剤名索引</title>
<style>
:root{
  --paper:#F4F7FB; --surface:#FFFFFF; --surface-2:#EAF0F8;
  --ink:#152238; --ink-soft:#4A5A72; --ink-faint:#8593A8;
  --navy:#1F3A68; --navy-dark:#14284A; --line:#D7E1EC;
  --teal:#0B6E6E; --teal-tint:#E3F1EF; --rust:#B8562E; --slate:#5B6B82; --oral:#2F7F86;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1526; --surface:#122236; --surface-2:#172B44; --ink:#E8EEF7; --ink-soft:#A9B8CE; --ink-faint:#6E819C;
    --navy:#8FB0E6; --navy-dark:#BFD2F2; --line:#22344C; --teal:#4FC3B8; --teal-tint:#173A37; --rust:#E59A7A; --slate:#A9B6CA; --oral:#5FC2C9;
  }
}
*{box-sizing:border-box;}
body{margin:0; background:var(--paper); color:var(--ink); font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif; line-height:1.6;}
.wrap{max-width:960px; margin:0 auto; padding:24px 16px 60px;}
a.back{color:var(--navy); text-decoration:none; font-weight:700; font-size:13.5px;}
h1{font-family:'Shippori Mincho',serif; font-size:26px; margin:18px 0 6px;}
.lead{color:var(--ink-soft); font-size:14px; margin:0 0 16px;}
.search{position:sticky; top:0; z-index:5; background:var(--paper); padding:10px 0 12px;}
.search input[type="search"]{width:100%; font-size:16px; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink);}
.search input[type="search"]:focus{outline:none; border-color:var(--navy);}
.filters{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; font-size:13px;}
.filters label{display:inline-flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px 10px; cursor:pointer;}
.kana{display:flex; flex-wrap:wrap; gap:4px; margin:4px 0 0;}
.kana a{font-size:13px; font-weight:700; color:var(--navy); text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:2px 9px;}
.count{font-size:12.5px; color:var(--ink-faint); margin:6px 0 0;}
h2{font-size:15px; color:var(--navy-dark); border-bottom:2px solid var(--line); padding-bottom:4px; margin:26px 0 8px;}
.drug{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:0 0 8px;}
.dname{font-weight:700; font-size:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.oral{font-size:11px; font-weight:700; color:#fff; background:var(--oral); border-radius:999px; padding:1px 8px;}
.refs{display:flex; flex-direction:column; gap:4px; margin-top:6px;}
.ref{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:13.5px;}
.cat{font-size:11px; font-weight:700; color:#fff; border-radius:4px; padding:1px 6px; flex:none;}
.cat.basics{background:var(--navy);} .cat.sideeffect{background:var(--rust);} .cat.cancer{background:var(--slate);}
.ref .t{font-weight:700;}
.ref .g{color:var(--ink-faint); font-size:12.5px;}
.ref a{color:var(--teal); font-weight:700; text-decoration:none; font-size:12.5px; border:1px solid var(--line); border-radius:999px; padding:1px 8px; background:var(--paper);}
.ix{font-size:11px; font-weight:700; color:var(--rust); border:1px solid var(--rust); border-radius:4px; padding:0 5px;}
.empty{color:var(--ink-soft); padding:20px 0;}
.note{font-size:12.5px; color:var(--ink-faint); margin-top:30px;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="wrap">
  <a class="back" href="index.html">← 一覧に戻る</a>
  <h1>薬剤名索引</h1>
  <p class="lead">薬剤名から、その薬が出てくる回(基礎知識・副作用・癌種別)を探せます。各回の要点まとめ・調剤薬局向け資料・動画へ移動できます。</p>
  <div class="search">
    <input id="q" type="search" placeholder="薬剤名の一部を入力(例:チニブ、カペシタビン、マブ)" autocomplete="off">
    <div class="filters">
      <label><input type="checkbox" id="oralOnly"> 経口薬のみ</label>
      <label><input type="checkbox" id="ixOnly"> 相互作用表に掲載</label>
    </div>
    <div class="kana" id="kana"></div>
    <p class="count" id="count"></p>
  </div>
  <div id="list"></div>
  <p class="note">掲載薬剤は、本シリーズの分類マップに載せた国内承認済みの代表的な薬剤です(2026-10-11時点)。「経口」は保険薬局で交付されることが多い経口薬、「相互作用」はその回の相互作用表に掲載があることを示します。最新の情報は添付文書でご確認ください。</p>
</div>

const TOPIC = Object.fromEntries(DATA.topics.map(t => [t.id, t]));
const CAT = {"basics":"基礎知識","sideeffect":"副作用","cancer":"癌種別"};
const ROWS = [["ア","アイウエオァィゥェォヴ"],["カ","カキクケコガギグゲゴヵヶ"],["サ","サシスセソザジズゼゾ"],["タ","タチツテトダヂヅデドッ"],["ナ","ナニヌネノ"],["ハ","ハヒフヘホバビブベボパピプペポ"],["マ","マミムメモ"],["ヤ","ヤユヨャュョ"],["ラ","ラリルレロ"],["ワ","ワヲン"]];
const rowOf = (name) => { const ch = name.replace(/^[Ld]-/, "")[0]; const r = ROWS.find(([, s]) => s.includes(ch)); return r ? r[0] : "英数"; };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const toKata = (s) => s.replace(/[\u3041-\u3096]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60));
const norm = (s) => toKata(s.normalize("NFKC")).toLowerCase();
const $ = (id) => document.getElementById(id);

function render() {
  const q = norm($("q").value.trim());
  const oralOnly = $("oralOnly").checked, ixOnly = $("ixOnly").checked;
  const hits = DATA.drugs.filter(d => (!q || norm(d.name).includes(q)) && (!oralOnly || d.oral) && (!ixOnly || d.refs.some(r => r.ix)));
  const groups = {};
  hits.forEach(d => { (groups[rowOf(d.name)] = groups[rowOf(d.name)] || []).push(d); });
  const order = [...ROWS.map(r => r[0]), "英数"].filter(k => groups[k]);
  $("kana").innerHTML = order.map(k => '<a href="#g-' + k + '">' + k + '</a>').join("");
  $("count").textContent = hits.length + " 件";
  $("list").innerHTML = hits.length ? order.map(k => '<h2 id="g-' + k + '">' + k + '</h2>' + groups[k].map(d =>
    '<div class="drug"><div class="dname">' + esc(d.name) + (d.oral ? '<span class="oral">経口</span>' : '') + '</div><div class="refs">' +
    d.refs.map(r => { const t = TOPIC[r.id]; return '<div class="ref"><span class="cat ' + t.cat + '">' + CAT[t.cat] + '</span><span class="t">' + esc(t.title) + '</span><span class="g">' + esc(r.group) + '</span>' +
      (r.ix ? '<span class="ix">相互作用</span>' : '') +

    '</div></div>').join("")).join("") : '<p class="empty">該当する薬剤がありません。表記(例:「パクリタキセル」)を変えてお試しください。</p>';
}
["q", "oralOnly", "ixOnly"].forEach(id => $(id).addEventListener("input", render));
render();
