<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用語集</title>
<style>
:root{
  --paper:#F4F7FB; --surface:#FFFFFF; --surface-2:#EAF0F8;
  --ink:#152238; --ink-soft:#4A5A72; --ink-faint:#8593A8;
  --navy:#1F3A68; --navy-dark:#14284A; --line:#D7E1EC;
  --teal:#0B6E6E; --teal-tint:#E3F1EF; --rust:#B8562E; --slate:#5B6B82; --plum:#7A4A8C; --gold:#8A6A1F; --red:#B03A3A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1526; --surface:#122236; --surface-2:#172B44; --ink:#E8EEF7; --ink-soft:#A9B8CE; --ink-faint:#6E819C;
    --navy:#8FB0E6; --navy-dark:#BFD2F2; --line:#22344C; --teal:#4FC3B8; --teal-tint:#173A37; --rust:#E59A7A; --slate:#A9B6CA; --plum:#C9A3D9; --gold:#D9B865; --red:#E58A8A;
  }
}
*{box-sizing:border-box;}
body{margin:0; background:var(--paper); color:var(--ink); font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif; line-height:1.6;}
.wrap{max-width:960px; margin:0 auto; padding:24px 16px 60px;}
a.back{color:var(--navy); text-decoration:none; font-weight:700; font-size:13.5px;}
h1{font-family:'Shippori Mincho',serif; font-size:26px; margin:18px 0 6px;}
.lead{color:var(--ink-soft); font-size:14px; margin:0 0 16px;}
.search{position:sticky; top:0; z-index:5; background:var(--paper); padding:10px 0 12px;}
.search input[type="search"]{width:100%; font-size:16px; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink);}
.search input[type="search"]:focus{outline:none; border-color:var(--navy);}
.filters{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; font-size:13px;}
.filters button{font:inherit; font-size:13px; font-weight:700; cursor:pointer; background:var(--surface); color:var(--ink-soft); border:1px solid var(--line); border-radius:999px; padding:4px 12px;}
.filters button.on{background:var(--navy); border-color:var(--navy); color:#fff;}
.filters button[data-c]:not([data-c="all"]).on{background:var(--c); border-color:var(--c);}
.kana{display:flex; flex-wrap:wrap; gap:4px; margin:8px 0 0;}
.kana a{font-size:13px; font-weight:700; color:var(--navy); text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:2px 9px;}
.count{font-size:12.5px; color:var(--ink-faint); margin:6px 0 0;}
h2{font-size:15px; color:var(--navy-dark); border-bottom:2px solid var(--line); padding-bottom:4px; margin:26px 0 8px;}
.term{background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--c); border-radius:10px; padding:10px 14px; margin:0 0 8px;}
.thead{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
.tname{font-weight:700; font-size:16.5px;}
.full{font-size:12.5px; color:var(--ink-faint);}
.cat{font-size:11px; font-weight:700; color:#fff; background:var(--c); border-radius:4px; padding:1px 7px; margin-left:auto;}
.def{font-size:15.5px; line-height:1.75; margin:6px 0 0;}
.refs{display:flex; flex-wrap:wrap; gap:3px 9px; margin-top:7px; font-size:11px; line-height:1.5;}
.refs .lbl{color:var(--ink-faint); font-weight:700;}
.ref{display:inline-flex; align-items:center; gap:4px;}
.ref .tc{font-size:9.5px; font-weight:700; color:#fff; border-radius:3px; padding:0 5px; background:var(--slate);}
.ref .tc.基礎知識{background:var(--navy);} .ref .tc.副作用{background:var(--rust);} .ref .tc.心血管{background:var(--red);}
.ref a{color:var(--teal); font-weight:700; text-decoration:none;}
.ref a:hover{text-decoration:underline;}
.ref .k{color:var(--ink-faint);}
details.more summary{cursor:pointer; color:var(--ink-faint); font-weight:700; list-style:none;}
details.more[open] summary{display:none;}
.c-mech{--c:var(--navy);} .c-ae{--c:var(--rust);} .c-test{--c:var(--teal);} .c-tx{--c:var(--plum);} .c-prac{--c:var(--gold);}
.empty{color:var(--ink-soft); padding:20px 0;}
.note{font-size:12.5px; color:var(--ink-faint); margin-top:30px;}
mark{background:#FDEBB4; color:inherit; padding:0 1px; border-radius:2px;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
</head>

  <h1>用語集</h1>
  <p class="lead">このサイトに出てくる専門用語と英語の略語をまとめました。用語ごとに、その用語が使われている回(要点まとめ・調剤薬局向け・患者向け)へ移動できます。</p>
  <div class="search">
    <input type="search" id="q" placeholder="用語・略語・説明文で検索(例:FN、ADC、手足症候群)" autocomplete="off">
    <div class="filters" id="filters">
      <button data-c="all" class="on">すべて</button>
      <button data-c="mech" class="c-mech">薬理・作用機序</button>
      <button data-c="ae" class="c-ae">副作用・病態</button>
      <button data-c="test" class="c-test">検査・評価</button>
      <button data-c="tx" class="c-tx">治療・レジメン</button>
      <button data-c="prac" class="c-prac">薬局実務・制度</button>
    </div>
    <div class="kana" id="kana"></div>
    <p class="count" id="count"></p>
  </div>
  <div id="list"></div>
  <p class="note">説明は各薬剤の添付文書・適正使用ガイド、CTCAE v5.0(JCOG版)、国内外の診療ガイドラインに基づく一般的な内容です。個々の患者への適用は、最新の添付文書と各施設の基準をご確認ください。</p>
</div>

const refHtml = (r) => '<span class="ref"><span class="tc ' + r.cat + '">' + r.cat + '</span>' +
  r.links.map((l, i) => '<a href="' + l.f + '">' + (i ? '' : esc(r.name) + ' ') + '<span class="k">' + l.kind + '</span></a>').join(' ') + '</span>';
function card(d, q) {
  const hl = (s) => { const t = esc(s); if (!q) return t; const i = norm(s).indexOf(q); return i < 0 ? t : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
  const shown = d.refs.slice(0, 4), rest = d.refs.slice(4);
  return '<div class="term c-' + d.cat + '"><div class="thead"><span class="tname">' + hl(d.term) + '</span><span class="full">' + hl(d.full) + '</span><span class="cat">' + CAT[d.cat] + '</span></div>' +
    '<p class="def">' + hl(d.def) + '</p>' +
    (d.refs.length ? '<div class="refs"><span class="lbl">使われている回:</span>' + shown.map(refHtml).join("") +
      (rest.length ? '<details class="more"><summary>ほか' + rest.length + '件 ▾</summary><div class="refs">' + rest.map(refHtml).join("") + '</div></details>' : '') + '</div>' : '') +
    '</div>';
}
function render() {
  const q = norm($("q").value.trim());
  const hits = DATA.filter(d => (cat === "all" || d.cat === cat) &&
    (!q || [d.term, d.full, d.def, d.yomi, ...d.alias].some(s => norm(s).includes(q))))
    .sort((a, b) => sortKey(a).localeCompare(sortKey(b), "ja"));
  const groups = {};
  hits.forEach(d => { (groups[groupOf(d)] = groups[groupOf(d)] || []).push(d); });
  const order = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ", "0-9", ...ROWS.map(r => r[0]), "他"].filter(k => groups[k]);
  $("kana").innerHTML = order.map(k => '<a href="#g-' + k + '">' + k + '</a>').join("");
  $("count").textContent = hits.length + " 語";
  $("list").innerHTML = hits.length ? order.map(k => '<h2 id="g-' + k + '">' + k + '</h2>' + groups[k].map(d => card(d, q)).join("")).join("")
    : '<p class="empty">該当する用語がありません。別の表記(カタカナ・英字)でもお試しください。</p>';
}
$("q").addEventListener("input", render);
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  cat = b.dataset.c;
  document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("on", x === b));
  render();
});
render();
</script>
</body>
</html>
