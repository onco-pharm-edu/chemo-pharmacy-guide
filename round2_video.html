<style>
:root{

@media (prefers-color-scheme: dark){

}
:root[data-theme="dark"]{
  --paper:#0D1917; --surface:#153230; --ink:#EAF3F1; --ink-soft:#A9C4C0; --ink-faint:#6F908B;
  --teal-dark:#BFEAE4; --teal:#4FC3B8; --teal-tint:#1B3E3A; --teal-line:#2E5951; --line:#274541;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--paper); color:var(--ink); font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;}
.wrap{max-width:900px; margin:0 auto; padding:24px 20px 60px;}
a.back{color:var(--teal-dark); text-decoration:none; font-weight:700; font-size:13.5px; display:inline-flex; align-items:center; gap:4px;}
.head{margin:22px 0 16px;}
.tag{font-family:'Shippori Mincho',serif; font-weight:700; color:var(--teal-dark); background:var(--teal-tint); display:inline-block; padding:4px 12px; border-radius:6px; font-size:13px; margin:0 0 10px;}

.sub{font-size:14px; color:var(--ink-soft); margin:0;}
.player{

  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-decoration:none; color:#fff;
}
.player:hover .playcircle{transform:scale(1.06);}
.playcircle{
  width:76px; height:76px; border-radius:50%; background:rgba(255,255,255,.16); border:1.5px solid rgba(255,255,255,.5);
  display:flex; align-items:center; justify-content:center; transition:transform .15s ease;
}
.playcircle svg{width:28px; height:28px; fill:#fff; margin-left:3px;}
.player .cta{font-size:15px; font-weight:700;}
.player .hint{font-size:12.5px; color:rgba(255,255,255,.75);}
.note{font-size:12.5px; color:var(--ink-faint); line-height:1.7;}
